# 每天一次：IMF PortWatch 港口与咽喉要道、UN Comtrade 中国与各国贸易额（都免费、不要密钥）→ data/logistics.json
name: logistics
on:
  schedule: [{ cron: "41 2,14 * * *" }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: data-write, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/logistics.py
      - run: python3 tools/seed_docs.py
      - name: Commit
        run: |
          git config user.name "bri-bot"; git config user.email "bri-bot@users.noreply.github.com"
          git add data seeds; git diff --cached --quiet && exit 0
          git commit -qm "logistics $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
