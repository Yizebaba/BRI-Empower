# 每天两次：航空、铁路、公路咽喉要道（150 国的主要机场、跨境铁路口岸、公路口岸和每段陆地边境）→ data/chokepoints_land.json
name: chokepoints
on:
  schedule: [{ cron: "17 1,13 * * *" }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: chokepoints, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q shapely
      - run: python3 tools/chokepoints_land.py
      - name: Commit
        run: |
          git config user.name "bri-bot"; git config user.email "bri-bot@users.noreply.github.com"
          git add data/chokepoints_land.json; git diff --cached --quiet && exit 0
          git commit -qm "chokepoints $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 7; done
