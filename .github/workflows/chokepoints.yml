# 每天两次：航空、铁路、公路咽喉要道（150 国的主要机场、跨境铁路口岸、公路口岸和每段陆地边境）→ data/chokepoints_land.json
name: chokepoints
on:
  schedule: [{ cron: "17 1,13 * * *" }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: chokepoints, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q shapely
      - run: python3 tools/chokepoints_land.py
      - name: Commit
        run: bash tools/push_data.sh "chokepoints $(date -u +%F)" data/chokepoints_land.json
