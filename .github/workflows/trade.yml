# 每周一次：世界银行和 Wikidata 国家基本面（data/country_facts.json）；UN Comtrade 各国进出口（按 97 个行业大类）、主要贸易伙伴、中国对该国的分行业贸易（免费、不要密钥）→ data/trade/
name: trade
on:
  schedule: [{ cron: "23 3 * * 1" }]
  workflow_dispatch:
    inputs:
      countries: { description: "只跑这些国家（ISO3，逗号分隔；空 = 全部 150 国）", default: "", type: string }
permissions: { contents: write }
concurrency: { group: trade, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/country_facts.py
        continue-on-error: true
      - run: python3 tools/trade.py ${{ inputs.countries }}
      - name: Commit
        run: bash tools/push_data.sh "trade $(date -u +%F)" data/trade data/trade_index.json data/country_facts.json
