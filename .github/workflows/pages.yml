# 发布网页：把 site/ 推到 gh-pages 分支（GitHub 会自动从这个分支发布，不用在 Settings 里设置）。
# 数据不随网页发布：网页运行时直接读仓库的 data/、seeds/，数据更新不用重新发布。
name: pages
on:
  push: { branches: [main], paths: ["site/**", ".github/workflows/pages.yml"] }
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Push site/ to gh-pages
        run: |
          cd site && touch .nojekyll && git init -q -b gh-pages && git add -A
          git -c user.name=bri-bot -c user.email=bri-bot@users.noreply.github.com commit -qm "site from ${GITHUB_SHA::8}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
