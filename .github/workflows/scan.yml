# 每 30 分钟：150 国态势（USGS、GDACS、NASA EONET、美国旅行建议）、11 个重点项目周边、World Monitor 原始数据按国家整理、重新生成种子文档。有变化就提交。
name: scan
on:
  schedule: [{ cron: "7,37 * * * *" }]
  push: { branches: [main], paths: ["data/wm_raw/**"] }
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: data-write, cancel-in-progress: false }
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q shapely
      - name: Countries
        run: python3 tools/country_scan.py || true
      - name: Key projects
        run: python3 tools/bri_scan.py data/projects.json data/live.json || true
      - name: World Monitor by country
        run: python3 tools/wm_process.py || true
      - name: Seed documents
        run: python3 tools/seed_docs.py
      - name: Commit
        run: |
          git config user.name "bri-bot"; git config user.email "bri-bot@users.noreply.github.com"
          git add data seeds
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -qm "scan $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
