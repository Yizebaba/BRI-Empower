# MiroFish 推演（github.com/666ghj/MiroFish，AGPL-3.0；不改它的代码，只调用它的后端接口）。
# 网页表单提交 → 本工作流：把所选范围的种子文档（seeds/）和你写的推演要求自动上传给 MiroFish → 建图谱 → 模拟 → 报告，结果提交到 runs/<编号>/。
# 推演要求只能由使用者自己填写，本工作流不替你生成。
# 需要仓库 Secrets：LLM_API_KEY、LLM_BASE_URL、LLM_MODEL_NAME（任意 OpenAI 格式接口）、ZEP_API_KEY（Zep Cloud）。
# 计算主要在模型和 Zep 的云端，运行器只做调度。
name: drill
run-name: "推演 ${{ inputs.request_id }} · ${{ inputs.title || inputs.scope }}"
on:
  workflow_dispatch:
    inputs:
      requirement: { description: "推演要求（你自己写，必填）", required: true, type: string }
      scope: { description: "种子文档范围：NPL / LAO / PAK / ALL", required: true, default: "ALL", type: string }
      title: { description: "标题（可空）", required: false, default: "", type: string }
      max_rounds: { description: "模拟轮数（建议先小于 40）", required: false, default: "20", type: string }
      request_id: { description: "网页生成的编号，用来在网页上对上这次运行", required: false, default: "", type: string }
      mirofish_ref: { description: "MiroFish 提交号（固定版本）", required: false, default: "7657031ac01184afe2cb220f5ee3545573b5e843", type: string }
permissions: { contents: write }
concurrency: { group: drill, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      REQ: ${{ inputs.requirement }}
      SCOPE: ${{ inputs.scope }}
      TITLE: ${{ inputs.title }}
      ROUNDS: ${{ inputs.max_rounds }}
      RID: ${{ inputs.request_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare inputs (seed docs of the chosen scope + your requirement)
        run: |
          python3 - <<'PY'
          import json, os, re, shutil, time
          req = os.environ["REQ"].strip()
          assert len(req) >= 10, "推演要求太短（至少 10 个字）"
          scope = os.environ["SCOPE"].strip().upper()
          idx = json.load(open("seeds/index.json"))["scopes"]
          keys = list(idx) if scope == "ALL" else [k for k in re.split(r"[ ,]+", scope) if k in idx]
          assert keys, "范围不对：" + scope
          rid = os.environ.get("RID") or time.strftime("%Y%m%dT%H%M%SZ", time.gmtime())
          rid = re.sub(r"[^A-Za-z0-9_-]", "", rid)[:40]
          os.makedirs("mf_in/seed", exist_ok=True)
          files = []
          for k in keys:
              for f in idx[k]["files"]:
                  if k != keys[0] and f["path"].endswith("00_sources.md"): continue
                  dst = f"mf_in/seed/{k}_{os.path.basename(f['path'])}"; shutil.copy(f["path"], dst); files.append(f["path"])
          open("mf_in/requirement.txt", "w").write(req)
          ctx = "种子文档由 BRI-Empower 自动从公开数据源生成（AidData、USGS、GDACS、NASA EONET、Google 新闻、IODA、美英旅行建议、UCDP/World Monitor），每条事实都注明来源和时间。范围：" + "、".join(idx[k]["name"] for k in keys) + "。"
          open("mf_in/context.txt", "w").write(ctx)
          out = f"runs/{rid}"; os.makedirs(out, exist_ok=True)
          json.dump({"id": rid, "title": os.environ.get("TITLE") or "", "requirement": req, "scope": keys, "seeds": files, "max_rounds": os.environ.get("ROUNDS") or "20",
                     "started": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"},
                    open(f"{out}/request.json", "w"), ensure_ascii=False, indent=1)
          open(os.environ["GITHUB_ENV"], "a").write(f"OUT={out}\nRUNID={rid}\n")
          PY
      - name: Check secrets (only says whether each is set)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL_NAME: ${{ secrets.LLM_MODEL_NAME }}
          ZEP_API_KEY: ${{ secrets.ZEP_API_KEY }}
        run: |
          miss=""; for k in LLM_API_KEY LLM_BASE_URL LLM_MODEL_NAME ZEP_API_KEY; do [ -z "${!k}" ] && miss="$miss $k"; done
          if [ -n "$miss" ]; then echo "缺少 Secrets：$miss"; echo "MISSING=$miss" >> $GITHUB_ENV; fi
      - uses: actions/setup-python@v5
        if: env.MISSING == ''
        with: { python-version: "3.11" }
      - uses: astral-sh/setup-uv@v6
        if: env.MISSING == ''
      - name: Install MiroFish backend (pinned)
        if: env.MISSING == ''
        run: |
          git clone -q https://github.com/666ghj/MiroFish.git mf && cd mf && git checkout -q "${{ inputs.mirofish_ref }}"
          cd backend && (uv sync --frozen || uv sync)
      - name: Start backend, upload seeds and requirement, run
        if: env.MISSING == ''
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL_NAME: ${{ secrets.LLM_MODEL_NAME }}
          ZEP_API_KEY: ${{ secrets.ZEP_API_KEY }}
          MF_TITLE: ${{ inputs.title }}
        run: |
          mkdir -p mf_out; cd mf/backend
          printf 'LLM_API_KEY=%s\nLLM_BASE_URL=%s\nLLM_MODEL_NAME=%s\nZEP_API_KEY=%s\n' "$LLM_API_KEY" "$LLM_BASE_URL" "$LLM_MODEL_NAME" "$ZEP_API_KEY" > ../.env
          setsid nohup uv run python run.py > ../../mf_out/backend.log 2>&1 < /dev/null &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5001/health && break; sleep 3; done
          cd ../..
          python3 tools/mirofish_run.py mf_in mf_out "${ROUNDS:-20}" || true
          c=$(grep -o "status=[0-9][0-9][0-9]" mf_out/backend.log | tail -1 | cut -d= -f2); [ -n "$c" ] && python3 -c "import json,sys;p='mf_out/status.json';d=json.load(open(p));d['upstream_status']=int(sys.argv[1]);d['upstream_hint']={'402':'模型账户余额不足，需要充值','401':'模型密钥无效','429':'模型接口限流'}.get(sys.argv[1],'');json.dump(d,open(p,'w'),ensure_ascii=False,indent=1)" "$c" || true
          for f in mf_out/backend.log mf_out/run.log; do [ -f "$f" ] && for k in "$LLM_API_KEY" "$ZEP_API_KEY"; do [ -n "$k" ] && sed -i "s|$k|***|g" "$f" || true; done; done
          rm -f mf/.env
      - name: Save results to runs/ and the index
        if: always()
        run: |
          mkdir -p "$OUT"
          if [ -n "$MISSING" ]; then echo "{\"ok\": false, \"error\": \"仓库缺少 Secrets：$MISSING\"}" > "$OUT/status.json"; fi
          for f in REPORT.md status.json run.log 01_ontology.json 03_profiles.json 04_config.json 05_run_status.json 07_agent_stats.json 11_report_meta.json; do [ -f "mf_out/$f" ] && cp "mf_out/$f" "$OUT/"; done
          [ -f mf_out/backend.log ] && tail -c 200000 mf_out/backend.log > "$OUT/backend.log" || true
          [ -f "$OUT/status.json" ] || echo '{"ok": false, "error": "运行中断，没有产生状态文件"}' > "$OUT/status.json"
          python3 - <<'PY'
          import json, os
          out = os.environ["OUT"]; rq = json.load(open(f"{out}/request.json")); st = json.load(open(f"{out}/status.json"))
          p = "runs/index.json"; idx = json.load(open(p)) if os.path.exists(p) else {"runs": []}
          idx["runs"] = [r for r in idx["runs"] if r["id"] != rq["id"]]
          idx["runs"].insert(0, {"id": rq["id"], "title": rq["title"], "scope": rq["scope"], "started": rq["started"], "finished": st.get("finished"),
                                 "ok": bool(st.get("ok")), "error": st.get("error") or st.get("upstream_hint") or "", "has_report": os.path.exists(f"{out}/REPORT.md"),
                                 "requirement": rq["requirement"][:300], "run_url": rq["run_url"]})
          json.dump(idx, open(p, "w"), ensure_ascii=False, indent=1)
          PY
          git config user.name "bri-bot"; git config user.email "bri-bot@users.noreply.github.com"
          git add runs; git commit -qm "drill $RUNID" || true
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 7; done
