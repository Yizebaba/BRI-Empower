name: debug-pw
on: { workflow_dispatch: {} }
jobs:
  d:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          B="https://services9.arcgis.com/weJ1QsnbMYJlCHdG/ArcGIS/rest/services/Daily_Ports_Data/FeatureServer/0"
          a=$(curl -s "$B/query?where=ISO3%3D%27PAK%27&returnCountOnly=true&f=json"); echo "::notice::A $a"
          b=$(curl -s "$B/query?where=ISO3%3D%27PAK%27&outFields=date,ISO3,portname,portcalls&resultRecordCount=2&orderByFields=date%20DESC&f=json" | head -c 700 | tr -d '\n'); echo "::notice::B $b"
          c=$(curl -s "$B/query?where=1%3D1&outFields=date,ISO3,portname&resultRecordCount=3&orderByFields=date%20DESC&f=json" | head -c 700 | tr -d '\n'); echo "::notice::C $c"
          d=$(curl -s "$B?f=json" | python3 -c "import json,sys;d=json.load(sys.stdin);print([(f['name'],f['type'][13:]) for f in d['fields']], d.get('maxRecordCount'), d.get('standardMaxRecordCount'))"); echo "::notice::D $d"
