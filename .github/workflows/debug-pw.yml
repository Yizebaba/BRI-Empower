name: debug-pw
on: { workflow_dispatch: {} }
jobs:
  d:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          B="https://services9.arcgis.com/weJ1QsnbMYJlCHdG/ArcGIS/rest/services/Daily_Ports_Data/FeatureServer/0/query"
          a=$(curl -s "$B?where=1%3D1&returnCountOnly=true&f=json"); echo "::notice::A $a"
          b=$(curl -s -G "$B" --data-urlencode "where=1=1" --data-urlencode 'outStatistics=[{"statisticType":"count","onStatisticField":"ObjectId","outStatisticFieldName":"n"},{"statisticType":"min","onStatisticField":"date","outStatisticFieldName":"d0"},{"statisticType":"max","onStatisticField":"date","outStatisticFieldName":"d1"}]' --data-urlencode "groupByFieldsForStatistics=ISO3" --data-urlencode "f=json" | python3 -c "import json,sys;d=json.load(sys.stdin);f=[x['attributes'] for x in d.get('features',[])];print(len(f),sorted(x['ISO3'] for x in f)[:400], f[:3], d.get('error'))"); echo "::notice::B $b"
          c=$(curl -s -G "$B" --data-urlencode "where=country LIKE '%akistan%'" --data-urlencode "returnCountOnly=true" --data-urlencode "f=json"); echo "::notice::C $c"
          e=$(curl -s "https://services9.arcgis.com/weJ1QsnbMYJlCHdG/ArcGIS/rest/services/PortWatch_ports_database/FeatureServer/0/query?where=ISO3%3D%27PAK%27&outFields=portname,portid,ISO3&f=json" | head -c 600 | tr -d '\n'); echo "::notice::E $e"
