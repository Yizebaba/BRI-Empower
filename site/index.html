function tabSources(){let h='';
 const fresh={worldmonitor:D.wm.generated,countries:null,usgs:D.clive.generated,gdacs:D.live.generated,eonet:D.live.generated,gnews:D.live.generated,ioda:D.live.generated,us_adv:D.live.generated,uk_adv:D.live.generated,x:0};
 h+=D.sources.map(s0=>{const s=EN()&&s0.en?Object.assign({},s0,s0.en,{how:""}):s0;return'<div class="src keep"><b>'+esc(s.name)+'</b> <a class="small" href="'+esc(/^https?:/.test(s.url)?s.url:"https://github.com/"+REPO+"/blob/main/"+s.url)+'" target="_blank" rel="noopener">'+(EN()?"Link":"链接")+' ↗</a><dl><dt>'+(EN()?"License":"许可")+'</dt><dd>'+esc(s.license)+'</dd><dt>'+(EN()?"Updates":"更新")+'</dt><dd>'+esc(s.cadence)+(fresh[s.id]?(EN()?", latest ":"，最近一次 ")+bj(fresh[s.id]):"")+'</dd><dt>'+(EN()?"Use":"用途")+'</dt><dd>'+esc(s.use)+'</dd>'+(s.how?'<dt>获取</dt><dd>'+esc(s.how)+'</dd>':"")+(s.cite?'<dt>'+(EN()?"Cite":"引用")+'</dt><dd>'+esc(s.cite)+'</dd>':"")+'</dl></div>'}).join("");return h}
const cls=r=>/错误/.test(r[0])?"fix":/^(对|一致|有)|一致$/.test(r[3])?"ok":/^(缺|漏)/.test(r[3])?"miss":"part";
const COL={ok:"#5fe0a8",part:"#f2c14e",miss:"#ff7a5c",fix:"#6aa8e0"},CNM={ok:"相符",part:"部分 / 有偏差",miss:"缺失或漏报"};
function tabRetro(){return EN()?tabRetro0():'<div class="keep">'+tabRetro0()+'</div>'}
function tabRetro0(){const Z=D.retro,R=EN()&&D.retroEn?D.retroEn:D.retro;const zr=(ti,ri)=>((Z.tests[ti]||{}).rows||[])[ri]||[];if(!R)return'<p class="mute">没有测试结果。</p>';const T={ok:0,part:0,miss:0};R.tests.forEach((t,ti)=>t.rows.forEach((r,ri)=>{const k=cls(zr(ti,ri));if(T[k]!=null)T[k]++}));
 let h='<h2 class="h2">推演测试</h2><p class="lead">'+esc(R.method)+'</p><div class="tally">'+["ok","part","miss"].map(k=>'<div><b style="color:'+COL[k]+'">'+T[k]+'</b><span>'+CNM[k]+'</span></div>').join("")+'</div>';
 R.tests.forEach((t,ti)=>{const op=!!OPEN[t.id];h+='<div class="tc"><button class="th" data-a="t:'+t.id+'" aria-expanded="'+op+'"><span><b style="font-weight:500">'+esc(t.name)+'</b><small>'+esc(t.mode)+'</small></span><span class="dots">'+t.rows.map((r,ri)=>'<i style="background:'+COL[cls(zr(ti,ri))]+'"></i>').join("")+'</span><span class="cv" style="transform:rotate('+(op?90:0)+'deg)">›</span></button>'
  +(op?'<div class="tr" style="grid-template-columns:1fr;color:var(--mute);font-size:12px">离项目：'+esc(t.nearest_project)+'</div>'+t.rows.map((r,ri)=>{const k=cls(zr(ti,ri));return'<div class="tr"><i style="background:'+COL[k]+'"></i><div><div style="font-weight:500">'+esc(r[0])+'</div><div class="small" style="color:'+COL[k]+'">'+esc(r[3])+'</div><dl><dt>平台</dt><dd>'+esc(r[1])+'</dd>'+(r[2]&&r[2]!=="—"?'<dt>参考</dt><dd>'+esc(r[2])+'</dd>':"")+'</dl></div></div>'}).join(""):"")+'</div>'});
 h+='<div class="note"><b style="color:var(--ink)">结论</b>'+(R.overall||[]).map(x=>'<p style="margin:6px 0 0">'+esc(x)+'</p>').join("")+'</div>';return h}
const TABS=[["drill","推演"],["live","国家"],["seeds","种子文档"],["sources","数据源"],["retro","推演测试"]];
function render(){if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#df"))return;
 $("tabs").innerHTML=TABS.map(t=>'<button role="tab" data-a="tab:'+t[0]+'" aria-selected="'+(TAB===t[0])+'">'+t[1]+'</button>').join("");
 const b=$("body"),y=b.scrollTop;let h;
 if(VIEW)h='<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><button class="back" data-a="back:1">← 返回</button>'+(VIEW.path&&/^seeds\//.test(VIEW.path)?'<button class="btn ghost" style="padding:5px 12px;font-size:12px" data-a="dl:'+esc(VIEW.path)+'">'+(EN()?"Use for simulation ↓":"用这个文档推演 ↓")+'</button>':"")+'</div>'+(VIEW.raw?VIEW.html:'<div class="md">'+VIEW.html+'</div>');
 else h=TAB==="drill"?tabDrill():TAB==="seeds"?tabSeeds():TAB==="sources"?tabSources():TAB==="retro"?tabRetro():tabLive();
 if(D.errs&&D.errs.length)h+='<p class="note">这次没读到：'+esc(D.errs.join("、"))+'。几分钟后会自动重试。</p>';
 b.innerHTML=h;trNode(b);trNode($("tabs"));b.scrollTop=y}
async function dlDoc(path,fname){try{let blob;if(/^https?:/.test(path)){const r=await fetch(path,{cache:"no-store"});if(!r.ok)throw new Error(r.status);blob=await r.blob()}else{const md=await get(path,true);blob=new Blob([md],{type:"text/markdown;charset=utf-8"})}const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname||path.replace(/^seeds\//,"").replace(/\//g,"_");document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}catch(e){alert((EN()?"Download failed: ":"下载失败：")+e.message)}}
async function openRep(dir){const r=D.runs.find(x=>x.dir===dir)||{dir};VIEW={html:'<p class="mute">读取中…</p>'};render();
 let md="";try{md=await get(RUNRAW+dir+"/report.md",true)}catch(e){try{md=await get(RUNRAW+dir+"/REPORT.md",true)}catch(e2){}}
 VIEW={raw:1,html:'<div class="note" style="border-color:#c9a227;color:var(--ink);margin-top:0"><b>'+(EN()?"Simulation result":"推演结果")+'</b><p style="margin:6px 0 0">'+esc(DISC())+'</p><div class="small" style="margin-top:8px">'+expHTML(Object.assign({},r,{has_report:false}))+'</div></div>'+(md?'<div class="md">'+DOMPurify.sanitize(marked.parse(md))+'</div>':'<p class="mute">'+(EN()?"No report yet.":"还没有报告。")+'</p>')};render();$("body").scrollTop=0}
async function openDoc(path,title){VIEW={path,html:'<p class="mute">读取中…</p>'};render();try{const md=await get(path,true);VIEW={path,html:DOMPurify.sanitize(marked.parse(md))}}catch(e){VIEW={html:'<p class="mute">读不到 '+esc(path)+'：'+esc(e.message)+'</p>'}}render();$("body").scrollTop=0}
document.addEventListener("click",async e=>{const a=e.target.closest("[data-a]");if(!a)return;const[k,v]=a.dataset.a.split(/:(.*)/s);
 if(k==="tab"){TAB=v;VIEW=null;ls.set("bri_tab",v);if(v==="drill")pollJobs()}
 else if(k==="c"){selectC(v);return}
 else if(k==="cl"){CT=null;SEL=null;glData()}else if(k==="pa")PJALL=!PJALL;
 else if(k==="dk"){const sc=SCOPE().filter(x=>x!==v);ls.set("bri_scope",[v].concat(sc).slice(0,5).join(","));TAB="drill";VIEW=null;ls.set("bri_tab","drill");pollJobs()}
 else if(k==="fx"){FILES.splice(+v,1);$("dflist").innerHTML=filesHTML();trNode($("dflist"));return}
 else if(k==="sa"){SCOPE().flatMap(x=>((D.seeds[x]||{}).files||[]).map(f=>f.path)).forEach(p=>v==="1"?UNSEL.delete(p):UNSEL.add(p));reSeeds();return}
 else if(k==="rm"){ls.set("bri_scope",SCOPE().filter(x=>x!==v).join(","));$("dchips").innerHTML=chipsHTML();$("dseeds").innerHTML=seedsMulti();trNode($("dchips"));trNode($("dseeds"));return}else if(k==="sk"){ls.set("bri_seedc",v);TAB="seeds"}
 else if(k==="p"){SEL=SEL===v?null:v;const p=D.projects.find(x=>x.id===v);if(p&&SEL)focus(p.centroid[0],p.centroid[1])}
 else if(k==="z")ZOOM=!ZOOM;else if(k==="m")MORE[v]=!MORE[v];else if(k==="t")OPEN[v]=!OPEN[v];
 else if(k==="ck"){if(v==="toggle"){CHOKE_OPEN=!CHOKE_OPEN;ls.set("bri_choke",CHOKE_OPEN?"1":"0")}else CHOKE_K=v}
 else if(k==="doc"){openDoc(v);return}else if(k==="dl"){dlDoc(v);return}else if(k==="rep"){openRep(v);return}else if(k==="dx"){dlDoc(RUNRAW+v,v.replace(/^mirofish-bri\//,"").replace(/\//g,"_"));return}else if(k==="back")VIEW=null;
 render()});
document.addEventListener("input",e=>{if(e.target.id==="dreq")ls.set("bri_draft",e.target.value);if(e.target.id==="qs"){QS=e.target.value;const p=e.target.selectionStart;render();const q=$("qs");if(q){q.focus();q.setSelectionRange(p,p)}}});
document.addEventListener("click",e=>{if(e.target.id!=="lang")return;LANG=EN()?"zh":"en";try{localStorage.setItem("bri_lang",LANG)}catch(x){}applyLang();render();glData()});
function selectC(k){CT=k;SEL=null;PJALL=false;TAB="live";VIEW=null;const c=cinfo(k);if(c)focus(c.lat,c.lon);glData();render();$("body").scrollTop=0}
const reSeeds=()=>{$("dseeds").innerHTML=seedsMulti();trNode($("dseeds"))};
document.addEventListener("change",e=>{if(e.target.id==="dfiles"){for(const f of e.target.files||[])if(!FILES.some(x=>x.name===f.name&&x.size===f.size))FILES.push(f);e.target.value="";$("dflist").innerHTML=filesHTML();trNode($("dflist"))}
 if(e.target.classList&&e.target.classList.contains("sk")){const p=e.target.dataset.p;e.target.checked?UNSEL.delete(p):UNSEL.add(p);reSeeds();return}
 if(e.target.id==="dadd"&&e.target.value){const v=e.target.value,sc=SCOPE();if(!sc.includes(v)&&sc.length<5)ls.set("bri_scope",sc.concat([v]).join(","));e.target.value="";$("dchips").innerHTML=chipsHTML();$("dseeds").innerHTML=seedsMulti();trNode($("dchips"));trNode($("dseeds"))}
 if(e.target.id==="dprov"){const P=PRESETS.find(x=>x[0]===e.target.value);if(P&&P[0]!=="custom"){$("dbase").value=P[2];$("dmodel").value=P[3]}}if(e.target.id==="seedc"){ls.set("bri_seedc",e.target.value);render()}});
document.addEventListener("submit",async e=>{if(e.target.id!=="df")return;e.preventDefault();const m=$("dmsg"),btn=$("dgo"),V=id=>($(id).value||"").trim();
 const req=V("dreq");if(req.length<10){m.className="msg err";m.textContent="推演要求至少写 10 个字。";return}
 if(!V("dkey")||!V("dbase")||!V("dmodel")){m.className="msg err";m.textContent="请填模型接口地址、模型名和 API Key。";return}
 if(!V("dzep")){m.className="msg err";m.textContent="请填 Zep API Key。";return}
 const rem=$("dremember").checked;[["prov",V("dprov")],["base",V("dbase")],["model",V("dmodel")],["llm",V("dkey")],["zep",V("dzep")]].forEach(([k,v])=>ls.set("bri_k_"+k,rem||k==="prov"||k==="base"||k==="model"?v:null));
 btn.disabled=true;m.className="msg";m.textContent="正在检查密钥并提交…";
 try{const sc=SCOPE().join(","),title=V("dtitle"),fl=FILES.slice(),seeds=selSeeds();
  if(!fl.length&&!seeds.length)throw new Error(EN()?"Add at least one document: tick seed documents or upload your own":"至少要有一份文档：勾选种子文档，或上传自己的资料");
  if(fl.length>20)throw new Error(EN()?"At most 20 files":"最多 20 个文件");let tot=0;for(const f of fl){if(!/\.(pdf|md|markdown|txt)$/i.test(f.name))throw new Error((EN()?"Unsupported format: ":"不支持的格式：")+f.name);if(f.size>52428800)throw new Error((EN()?"Over 50 MB: ":"超过 50 MB：")+f.name);tot+=f.size}if(tot>104857600)throw new Error(EN()?"Over 100 MB in total":"合计超过 100 MB");
  if(seeds.length)seeds.unshift("seeds/00_sources.md");
  const r=await fetch(MFQ+"submit",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({project:"bri",scope:sc,title,requirement:req,rounds:Number(V("drounds")||0),seeds,files:fl.map(f=>({name:f.name,size:f.size})),llm_base:V("dbase"),llm_model:V("dmodel"),llm_key:V("dkey"),zep_key:V("dzep")})});
  let j=await r.json().catch(()=>({}));
  if(r.ok&&j.id&&j.upload_token){let done=0;const P=async(path,b)=>{for(let t=0;t<4;t++){try{const x=await fetch(MFQ+path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)});const y=await x.json().catch(()=>({}));if(x.ok)return y;if(x.status<500)throw new Error(y.error||x.status)}catch(e){if(t===3||!/fetch|network|5\d\d/i.test(String(e.message)))throw e}await new Promise(z=>setTimeout(z,1500*(t+1)))}};
   for(const f of fl){const d=await new Promise((ok,no)=>{const rd=new FileReader();rd.onload=()=>ok(String(rd.result).split(",")[1]||"");rd.onerror=()=>no(rd.error);rd.readAsDataURL(f)});
    for(let i=0,k=0;i<d.length;i+=j.chunk,k++){await P("upload",{id:j.id,tok:j.upload_token,name:f.name.replace(/[\\/:*?"<>|\x00-\x1f]/g,"_").slice(-100),idx:k,data:d.slice(i,i+j.chunk)});done+=Math.min(j.chunk,d.length-i)*3/4;m.textContent=(EN()?"Uploading ":"正在上传 ")+Math.min(100,Math.round(done/tot*100))+"%"}}
   j=Object.assign({},j,await P("commit",{id:j.id,tok:j.upload_token}))}

  if(r.ok&&j.id){JOBS.unshift({id:j.id,t:new Date().toISOString(),scope:sc,title});JOBS=JOBS.slice(0,30);ls.set("bri_jobs",JSON.stringify(JOBS));JST[j.id]={state:"queued"};ls.set("bri_draft",null);FILES=[];if($("dflist"))$("dflist").innerHTML="";
   m.className="msg ok";m.textContent="已排队。几分钟内开始运行，完整推演通常要几个小时。";$("dmine").innerHTML=mineHTML();trNode($("dmine"));setTimeout(pollJobs,3000)}
  else{m.className="msg err";m.textContent=j.error||("提交失败（"+r.status+"）")}}
 catch(x){m.className="msg err";m.textContent=(/^(最多|不支持|超过|合计|至少|上传|文件|At most|Unsupported|Over|Add)/.test(x.message)?"":"网络错误：")+x.message}btn.disabled=false;trNode(m)});
let PJ=null;async function pollJobs(){clearTimeout(PJ);const ids=JOBS.filter(j=>!JST[j.id]||!["done","failed","expired"].includes(JST[j.id].state)).map(j=>j.id).slice(0,20);
 if(ids.length){try{const r=await fetch(MFQ+"job?id="+ids.join(","));if(r.ok){const j=await r.json();let fin=false;for(const[id,v]of Object.entries(j.jobs||{})){if(v){if(v.state==="done"||v.state==="failed")fin=true;JST[id]=v}}
  if(fin)await get(RUNRAW+"mirofish-bri/index.json").then(x=>D.runs=x.runs||[]).catch(()=>{});
  const d=$("dmine");if(d){d.innerHTML=mineHTML();trNode(d)}const u=$("druns");if(u&&fin){u.innerHTML=runsHTML();trNode(u)}}}catch(e){}}
 if(TAB==="drill"&&!document.hidden&&JOBS.some(j=>!JST[j.id]||!["done","failed","expired"].includes(JST[j.id].state)))PJ=setTimeout(pollJobs,30000)}
applyLang();
(async()=>{let land=null;try{land=await (await fetch("land_dots.json")).json()}catch(e){}try{glInit(land)}catch(e){console.warn(e)}
 await load(true);setTimeout(()=>{if(!CT)focus(30,80)},900);
 if(TAB==="drill")pollJobs();setInterval(()=>{if(!document.hidden)load(false)},300000)})();
