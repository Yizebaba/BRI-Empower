 const rs=()=>{const w=cv.clientWidth,h=cv.clientHeight;R.setSize(w,h,false);C.aspect=w/h;C.position.x=innerWidth>900?.62:0;C.updateProjectionMatrix()};addEventListener("resize",rs);rs();

 const fresh={usgs:D.live.generated,gdacs:D.live.generated,eonet:D.live.generated,gnews:D.live.generated,ioda:D.live.generated,us_adv:D.live.generated,uk_adv:D.live.generated,worldmonitor:D.wm.generated};
 h+=D.sources.map(s=>'<div class="src"><b>'+esc(s.name)+'</b> <a class="small" href="'+esc(/^https?:/.test(s.url)?s.url:"https://github.com/"+REPO+"/blob/main/"+s.url)+'" target="_blank" rel="noopener">链接 ↗</a><dl><dt>许可</dt><dd>'+esc(s.license)+'</dd><dt>更新</dt><dd>'+esc(s.cadence)+(fresh[s.id]?"，最近一次 "+bj(fresh[s.id]):"")+'</dd><dt>用途</dt><dd>'+esc(s.use)+'</dd><dt>获取</dt><dd>'+esc(s.how)+'</dd>'+(s.cite?'<dt>引用</dt><dd>'+esc(s.cite)+'</dd>':"")+'</dl></div>').join("");return h}
const cls=r=>/错误/.test(r[0])?"fix":/^(对|一致|有)|一致$/.test(r[3])?"ok":/^(缺|漏)/.test(r[3])?"miss":"part";
const COL={ok:"#5fe0a8",part:"#f2c14e",miss:"#ff7a5c",fix:"#6aa8e0"},CNM={ok:"相符",part:"部分 / 有偏差",miss:"缺失或漏报"};
function tabRetro(){const R=D.retro;if(!R)return'<p class="mute">没有测试结果。</p>';const T={ok:0,part:0,miss:0};R.tests.forEach(t=>t.rows.forEach(r=>{const k=cls(r);if(T[k]!=null)T[k]++}));
 let h='<h2 class="h2">偏差测试</h2><p class="lead">'+esc(R.method)+'</p><div class="tally">'+["ok","part","miss"].map(k=>'<div><b style="color:'+COL[k]+'">'+T[k]+'</b><span>'+CNM[k]+'</span></div>').join("")+'</div>';
 R.tests.forEach(t=>{const op=!!OPEN[t.id];h+='<div class="tc"><button class="th" data-a="t:'+t.id+'" aria-expanded="'+op+'"><span><b style="font-weight:500">'+esc(t.name)+'</b><small>'+esc(t.mode)+'</small></span><span class="dots">'+t.rows.map(r=>'<i style="background:'+COL[cls(r)]+'"></i>').join("")+'</span><span class="cv" style="transform:rotate('+(op?90:0)+'deg)">›</span></button>'
  +(op?'<div class="tr" style="grid-template-columns:1fr;color:var(--mute);font-size:12px">离项目：'+esc(t.nearest_project)+'</div>'+t.rows.map(r=>{const k=cls(r);return'<div class="tr"><i style="background:'+COL[k]+'"></i><div><div style="font-weight:500">'+esc(r[0])+'</div><div class="small" style="color:'+COL[k]+'">'+esc(r[3])+'</div><dl><dt>平台</dt><dd>'+esc(r[1])+'</dd>'+(r[2]&&r[2]!=="—"?'<dt>参考</dt><dd>'+esc(r[2])+'</dd>':"")+'</dl></div></div>'}).join(""):"")+'</div>'});
 h+='<div class="note"><b style="color:var(--ink)">结论</b>'+(R.overall||[]).map(x=>'<p style="margin:6px 0 0">'+esc(x)+'</p>').join("")+'</div>';return h}
const TABS=[["live","态势"],["drill","推演"],["seeds","种子文档"],["sources","数据源"],["retro","偏差测试"]];
function render(){if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#df"))return;
 $("tabs").innerHTML=TABS.map(t=>'<button role="tab" data-a="tab:'+t[0]+'" aria-selected="'+(TAB===t[0])+'">'+t[1]+'</button>').join("");
 const b=$("body"),y=b.scrollTop;let h;
 if(VIEW)h='<button class="back" data-a="back:1">← 返回</button><div class="md">'+VIEW.html+'</div>';
 else h=TAB==="drill"?tabDrill():TAB==="seeds"?tabSeeds():TAB==="sources"?tabSources():TAB==="retro"?tabRetro():tabLive();
 if(D.errs&&D.errs.length)h+='<p class="note">这次没读到：'+esc(D.errs.join("、"))+'。几分钟后会自动重试。</p>';
 b.innerHTML=h;b.scrollTop=y}
async function openDoc(path,title){VIEW={html:'<p class="mute">读取中…</p>'};render();try{const md=await get(path,true);VIEW={html:DOMPurify.sanitize(marked.parse(md))}}catch(e){VIEW={html:'<p class="mute">读不到 '+esc(path)+'：'+esc(e.message)+'</p>'}}render();$("body").scrollTop=0}
document.addEventListener("click",async e=>{const a=e.target.closest("[data-a]");if(!a)return;const[k,v]=a.dataset.a.split(/:(.*)/s);
 if(k==="tab"){TAB=v;VIEW=null;ls.set("bri_tab",v);if(v==="drill")pollRuns()}
 else if(k==="c"){CT=v;SEL=null;const ps=D.projects.filter(p=>p.country===v);if(ps.length){const la=ps.reduce((s,p)=>s+p.centroid[0],0)/ps.length,lo=ps.reduce((s,p)=>s+p.centroid[1],0)/ps.length;focus(la,lo)}}
 else if(k==="p"){SEL=SEL===v?null:v;const p=D.projects.find(x=>x.id===v);if(p&&SEL)focus(p.centroid[0],p.centroid[1])}
 else if(k==="z")ZOOM=!ZOOM;else if(k==="m")MORE[v]=!MORE[v];else if(k==="t")OPEN[v]=!OPEN[v];
 else if(k==="doc"){openDoc(v);return}else if(k==="rep"){openDoc("runs/"+v+"/REPORT.md");return}else if(k==="back")VIEW=null;
 else if(k==="tok"){if(v==="save"){const t=($("tokin").value||"").trim();if(!/^(github_pat_|ghp_)/.test(t)){alert("令牌格式不对：应以 github_pat_ 开头");return}ls.set("bri_gh_token",t)}else ls.set("bri_gh_token",null)}
 render()});
document.addEventListener("input",e=>{if(e.target.id==="dreq")ls.set("bri_draft",e.target.value)});
document.addEventListener("change",e=>{if(e.target.id==="dscope"){ls.set("bri_scope",e.target.value);$("dseeds").innerHTML=seedPreview(e.target.value)}});
document.addEventListener("submit",async e=>{if(e.target.id!=="df")return;e.preventDefault();const tok=ls.get("bri_gh_token"),m=$("dmsg"),btn=$("dgo");
 const req=$("dreq").value.trim();if(req.length<10){m.className="msg err";m.textContent="推演要求至少写 10 个字。";return}
 const rid=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z"+Math.random().toString(36).slice(2,6);
 btn.disabled=true;m.className="msg";m.textContent="正在提交…";
 try{const r=await fetch("https://api.github.com/repos/"+REPO+"/actions/workflows/drill.yml/dispatches",{method:"POST",headers:{authorization:"Bearer "+tok,accept:"application/vnd.github+json","x-github-api-version":"2022-11-28"},
   body:JSON.stringify({ref:"main",inputs:{requirement:req,scope:$("dscope").value,title:$("dtitle").value.trim(),max_rounds:String($("drounds").value||20),request_id:rid}})});
  if(r.status===204){m.className="msg ok";m.textContent="已提交，编号 "+rid+"。运行状态会显示在下面的推演记录里。";ls.set("bri_draft",null);setTimeout(pollRuns,4000)}
  else{const t=await r.text();m.className="msg err";m.textContent=(r.status===401?"令牌无效或已过期，请断开后重新连接。":r.status===403||r.status===404?"令牌没有这个仓库的 Actions 写权限。":"提交失败（"+r.status+"）：")+t.slice(0,200)}}
 catch(x){m.className="msg err";m.textContent="网络错误："+x.message}btn.disabled=false});
let PR=null;async function pollRuns(){clearTimeout(PR);try{const tok=ls.get("bri_gh_token"),h={accept:"application/vnd.github+json"};if(tok)h.authorization="Bearer "+tok;
 const r=await fetch("https://api.github.com/repos/"+REPO+"/actions/workflows/drill.yml/runs?per_page=6",{headers:h});if(r.ok){const j=await r.json();const was=LIVE_RUNS.some(x=>x.status!=="completed");LIVE_RUNS=j.workflow_runs||[];
  if(was&&!LIVE_RUNS.some(x=>x.status!=="completed"))await get("runs/index.json").then(x=>D.runs=x.runs||[]).catch(()=>{});
  const d=$("druns");if(d)d.innerHTML=runsHTML()}}catch(e){}
 if(TAB==="drill"&&!document.hidden)PR=setTimeout(pollRuns,LIVE_RUNS.some(x=>x.status!=="completed")?20000:90000)}
(async()=>{let land=null;try{land=await (await fetch("land_dots.json")).json()}catch(e){}try{glInit(land)}catch(e){console.warn(e)}
 await load(true);const ps=D.projects.filter(p=>p.country===CT);if(ps.length)setTimeout(()=>focus(ps[0].centroid[0],ps[0].centroid[1]),1200);
 if(TAB==="drill")pollRuns();setInterval(()=>{if(!document.hidden)load(false)},300000)})();
</script>
